name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Release signing (docs/RELEASE.md). Without these secrets the release outputs are unsigned.
      ANTRESOL_KEYSTORE_BASE64: ${{ secrets.ANTRESOL_KEYSTORE_BASE64 }}
      ANTRESOL_KEYSTORE_PASSWORD: ${{ secrets.ANTRESOL_KEYSTORE_PASSWORD }}
      ANTRESOL_KEY_ALIAS: ${{ secrets.ANTRESOL_KEY_ALIAS }}
      ANTRESOL_KEY_PASSWORD: ${{ secrets.ANTRESOL_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug builds
        run: ./gradlew --no-daemon :core:test :ui-common:testDebugUnitTest :tv:testDebugUnitTest :mobile:testDebugUnitTest assembleDebug

      - name: Release keystore
        if: github.event_name != 'pull_request' && env.ANTRESOL_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANTRESOL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANTRESOL_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release builds (APK + App Bundle)
        if: github.event_name != 'pull_request'
        run: ./gradlew --no-daemon :tv:assembleRelease :mobile:assembleRelease :tv:bundleRelease :mobile:bundleRelease

      - name: Collect outputs
        if: github.event_name != 'pull_request'
        run: |
          version="$(sed -n 's/^antresolVersionName=//p' gradle.properties)"
          if [ -n "$ANTRESOL_KEYSTORE_FILE" ]; then suffix=""; else suffix="-unsigned"; fi
          mkdir -p dist/debug dist/release
          for app in tv mobile; do
            cp "$app/build/outputs/apk/debug/$app-debug.apk" "dist/debug/antresol-$app-$version-debug.apk"
            cp "$app"/build/outputs/apk/release/*.apk "dist/release/antresol-$app-$version$suffix.apk"
            cp "$app/build/outputs/bundle/release/$app-release.aab" "dist/release/antresol-$app-$version$suffix.aab"
            cp "$app/build/outputs/mapping/release/mapping.txt" "dist/release/antresol-$app-$version-mapping.txt"
          done
          ls -l dist/*

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: debug-apks
          path: dist/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: release
          path: dist/release/*

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4  # one folder per artifact: dist/debug-apks, dist/release
        with:
          path: dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Phone & tablet"; cat mobile/fastlane/metadata/android/en-US/changelogs/1.txt; echo
            echo "## Android TV"; cat tv/fastlane/metadata/android/en-US/changelogs/1.txt
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Antresol for Android $GITHUB_REF_NAME" --notes-file notes.md \
            dist/release/*.apk dist/release/*.aab dist/debug-apks/*.apk
