// Types the Compose compiler may treat as stable although their module (:core, plain Kotlin/JVM) is
// not compiled with it. Without this a composable taking one of them is re-run for every new
// instance, equal or not (a refresh that brings the same data again).
//
// Everything in the package is an immutable value: `val`s and read-only collections only, never
// changed after decoding. Keep it that way, or take the type out of this list.
app.antresol.core.model.*
